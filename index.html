<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="tc">
<meta name="description" content="Set a trip budget, log what you spend, and share one link so everyone sees what's left.">
<title>Velo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2236%22 fill=%22none%22 stroke=%22black%22 stroke-width=%2214%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">
<style>
:root{--bg:#FFFFFF;--fg:#000000;--muted:#6E6E6E;--line:#E6E6E6;--track:#EDEDED;--btn:var(--fg);--btn-fg:var(--bg);
  --s0:#000000;--s1:#3A3A3A;--s2:#5C5C5C;--s3:#7E7E7E;--s4:#A0A0A0;--s5:#BDBDBD;--s6:#D4D4D4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--fg:#FFFFFF;--muted:#8E8E8E;--line:#242424;--track:#1B1B1B;--s0:#FFFFFF;--s1:#D2D2D2;--s2:#AAAAAA;--s3:#848484;--s4:#646464;--s5:#4A4A4A;--s6:#363636}}
:root[data-theme="dark"]{--bg:#000000;--fg:#FFFFFF;--muted:#8E8E8E;--line:#242424;--track:#1B1B1B;--s0:#FFFFFF;--s1:#D2D2D2;--s2:#AAAAAA;--s3:#848484;--s4:#646464;--s5:#4A4A4A;--s6:#363636}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Geist,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:0 20px}
header.wrap{padding-top:20px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:16px;text-decoration:none}
.link{background:none;border:0;padding:0;color:var(--fg);font-weight:500;font-size:inherit;text-decoration:underline;text-underline-offset:3px}
.link.quiet{color:var(--muted);text-decoration:none;font-size:14px}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:8px}
.top{display:flex;align-items:flex-start;gap:12px}
.top h1{font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.pill{display:inline-block;margin-top:8px;font-size:12px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.icons{margin-left:auto;display:flex;gap:8px;flex:none}
.icon-btn{flex:none;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.ring-wrap{position:relative;width:min(250px,70vw);aspect-ratio:1;margin:26px auto 10px;container-type:inline-size;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ring-wrap svg{width:100%;height:100%;display:block}
.anim .ring-g{transform-origin:120px 120px;animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{opacity:0;transform:rotate(-30deg)}}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 18%}
.big{font-weight:300;font-size:clamp(30px,10vw,44px);line-height:1;letter-spacing:-.03em}
.rc-l{color:var(--muted);font-size:13px;margin-top:8px;max-width:100%;overflow-wrap:anywhere}
.rc-p{font-size:12px;margin-top:10px;padding:2px 10px;border:1px solid var(--fg);border-radius:999px}
.rc-p.inv{background:var(--fg);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;color:var(--muted);margin:4px 0 0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 0 12px 12px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat .v{font-weight:500;font-size:clamp(14px,4.3vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:12px;color:var(--muted)}
main.wrap{padding-top:18px;padding-bottom:120px}
main.page{padding-top:28px;padding-bottom:48px}
.page h1{font-weight:600;font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:4px 0 6px}
.lead{color:var(--muted);margin:0 0 6px}
.steps{font-size:12px;color:var(--muted)}
.alert{border:1px solid var(--fg);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.alert.inv{background:var(--fg);color:var(--bg)}
.sec{font-weight:600;font-size:14px;margin:18px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:8px;margin-bottom:4px}
.tools input{flex:1.4}.tools select{flex:1}
.day{display:flex;justify-content:space-between;margin:20px 0 2px;font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .body{min-width:0;flex:1}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:500;white-space:nowrap;text-align:right}
.row .a small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.trip-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.trip-row:first-of-type{border-top:1px solid var(--line)}
.trip-row svg{width:44px;height:44px;flex:none}
.trip-row .body{min-width:0;flex:1}
.trip-row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-row .m{font-size:13px;color:var(--muted)}
.trip-row .go{color:var(--muted);font-size:20px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.center h1{font-weight:600;font-size:22px;margin:0}
.center p{color:var(--muted);margin:0 0 14px;max-width:32ch}
.hero{text-align:center;padding-top:4px;padding-bottom:40px}
.hero h1{font-weight:600;font-size:clamp(28px,8.5vw,40px);line-height:1.08;letter-spacing:-.025em;margin:22px auto 12px;max-width:14ch}
.hero .intro{color:var(--muted);margin:0 auto 24px;max-width:34ch}
.points{text-align:left;margin-top:40px}
.pt{padding:14px 0;border-top:1px solid var(--line)}
.pt:last-child{border-bottom:1px solid var(--line)}
.pt b{display:block;font-weight:600}
.pt span{color:var(--muted);font-size:14px}
.foot{display:block;text-align:center;color:var(--muted);font-size:12px;padding:30px 0 0;text-decoration:none}
.foot u{text-underline-offset:3px}
.linkbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;word-break:break-all;margin:18px 0 12px;-webkit-user-select:all;user-select:all}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--btn);border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;background:var(--btn);color:var(--btn-fg);text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.sm{padding:9px 16px;font-size:14px;font-weight:500}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;padding:14px 28px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.scrim{position:fixed;inset:0;z-index:50;overscroll-behavior:contain;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;max-height:92dvh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:.5}}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font-weight:600;font-size:18px}
.x{border:1px solid var(--line);background:transparent;width:36px;height:36px;border-radius:999px;font-size:15px}
.f{display:block;margin:16px 0 6px;font-weight:500;font-size:13px;color:var(--muted)}
input,select{min-width:0;max-width:100%;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font:16px Geist,system-ui,sans-serif}
select option{background:var(--bg);color:var(--fg)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
html.locked,html.locked body{overflow:hidden;overscroll-behavior:none}
input:focus,select:focus{border-color:var(--fg);outline:none}
.gbtn{gap:10px;font-weight:600}
.gbtn:disabled{opacity:.6}
.or{display:flex;align-items:center;gap:12px;margin:18px 0 2px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:46px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;cursor:text}
.tags:focus-within{border-color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:2px;max-width:100%;padding:4px 4px 4px 12px;border-radius:999px;background:var(--btn);color:var(--btn-fg);font-size:14px;line-height:1.3;animation:tagIn .18s ease-out}
.tag>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag button{flex:none;border:0;background:transparent;color:inherit;opacity:.75;width:24px;height:24px;border-radius:999px;font-size:11px;display:grid;place-items:center}
.tags .tag-in{flex:1 1 120px;min-width:120px;width:auto;border:0;padding:6px 4px;background:transparent;border-radius:0}
.tags .tag-in:focus{outline:none}
@keyframes tagIn{from{transform:scale(.85);opacity:0}}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:13px;padding:10px}
.amt{display:flex;gap:8px;align-items:stretch}
.amt input{flex:1;min-width:0;font-weight:300;font-size:34px;letter-spacing:-.02em;padding:6px 12px}
.amt select{width:auto;flex:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:100%}
.chip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.chip input:focus-visible+span{outline:2px solid var(--fg);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--fg)}
.lim{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lim span{flex:1;min-width:0;font-size:14px}.lim input{width:120px;flex:none}
.actions{display:flex;gap:8px;margin-top:22px}
.actions .btn{flex:1}
.danger{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.err{font-size:14px;margin-top:10px;min-height:1em;font-weight:500}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:500;font-size:14px;max-width:90vw;text-align:center}
.meta-row{display:flex;align-items:center;gap:10px;min-height:20px;margin-bottom:6px}
.meta-row .back{margin-bottom:0}
.clock{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.01em}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.theme{position:relative;display:block;text-align:center;font-size:12px;color:var(--muted);cursor:pointer}
.theme input{position:absolute;opacity:0;width:1px;height:1px}
.theme .sw{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);margin-bottom:6px}
.theme .sw svg{width:62%;height:62%}
.theme input:checked+.sw{outline:2px solid var(--fg);outline-offset:2px}
.theme input:focus-visible+.sw{outline:2px dashed var(--fg);outline-offset:3px}
.theme input:checked~.nm{color:var(--fg);font-weight:600}
.locbox{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:14px;min-height:40px}
.locbox .coords{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pin{flex:none;color:var(--muted);display:grid;place-items:center;width:30px;height:30px;border-radius:999px}
a.pin{border:1px solid var(--line)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:14px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 0;margin-bottom:-1px;border-bottom:2px solid transparent;font-weight:500;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--btn)}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px;font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv b{font-weight:500;white-space:nowrap}
.kv small{display:block;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-bottom:14px}
.mini{padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.mini:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.mini .v{font-weight:500;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .l{font-size:12px;color:var(--muted)}
.sum-hero{padding:6px 0 16px}
.sum-hero .k{font-size:13px;color:var(--muted)}
.sum-hero .n{font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1.1}
.sum-hero .d{color:var(--muted);font-size:14px}
.cat-line{display:flex;align-items:center;gap:10px;margin:10px 0 6px;font-size:14px}
.cat-line .n{flex:1}.cat-line .s{color:var(--muted);font-size:13px}
.bar{height:5px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.pos{font-weight:600}.neg{font-weight:600;color:var(--muted)}
.settle{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.settle:first-of-type{border-top:0}
.settle b{margin-left:auto;font-weight:600;white-space:nowrap}
.settle .btn.sm{padding:6px 12px;font-size:13px;flex:none}
.btn-row{display:flex;gap:8px;margin-top:6px}.btn-row .btn{flex:1}
.map-wrap{position:relative;height:min(62vh,540px);min-height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--track);isolation:isolate}
.map-wrap .mapc{position:absolute;inset:0;width:100%;height:100%}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:14px}
.map-tools{position:absolute;top:10px;left:10px;z-index:3;display:flex;gap:6px}
.map-btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.map-card{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s ease-out}
.map-card[hidden]{display:none}
.map-card .body{flex:1;min-width:0}.map-card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-card .m{font-size:13px;color:var(--muted)}.map-card .a{font-weight:600;white-space:nowrap}
.map-card.list{flex-direction:column;align-items:stretch;gap:0;max-height:58%;padding:12px 14px 6px}
.map-card .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px}
.map-card .clist{overflow-y:auto;overscroll-behavior:contain;margin:0 -14px;padding:0 14px}
.map-card .crow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.bubble em{font-style:normal;display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--bg);color:var(--fg);font-size:11px;font-weight:700;vertical-align:1px}
.stack{display:grid;align-items:end;justify-items:start}
.stack>.bubble{grid-area:1/1;transform:var(--tf,none);transform-origin:50% 100%}
.bubble{position:relative;border:0;padding:0 0 7px;background:none;cursor:pointer;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.bubble.up::after{display:none}
.bubble.up span{box-shadow:0 -1px 0 rgba(0,0,0,.05),0 8px 18px rgba(0,0,0,.3)}
.bubble.more span{background:var(--bg);color:var(--fg);border-color:var(--line)}
.bubble span{display:block;padding:6px 11px;border-radius:999px;background:var(--c);color:var(--ct);font:600 12px/1.2 Geist,system-ui,sans-serif;white-space:nowrap;border:2px solid var(--bg);box-shadow:0 6px 16px rgba(0,0,0,.28)}
.bubble::after{content:'';position:absolute;left:50%;bottom:2px;width:9px;height:9px;background:var(--c);transform:translateX(-50%) rotate(45deg);border-right:2px solid var(--bg);border-bottom:2px solid var(--bg)}
.bubble.sel span{transform:scale(1.12);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 8px 20px rgba(0,0,0,.3)}
@keyframes pop{from{transform:var(--tf,none) translateY(14px) scale(.2);opacity:0}}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}
.map-credit{font-size:7px;line-height:1.2;letter-spacing:.02em;color:var(--muted);opacity:.28;text-align:right;margin:4px 4px 0}
.map-credit a{color:inherit}
.land{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.land-nav{width:100%;max-width:1160px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}
.land-main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px 36px}
.land-grid{width:100%;max-width:1160px;display:grid;gap:clamp(20px,4vh,36px);justify-items:center;text-align:center}
.hero-ring{position:relative;width:min(80vw,50vh,440px);aspect-ratio:1;container-type:inline-size;-webkit-user-select:none;user-select:none}

/* ---------- trip maths ---------- */
function catList(t,ex){const known={},out=(t.categories||[]).slice();out.forEach(c=>{known[c.id]=1});
  (ex||[]).forEach(e=>{if(!known[e.cat]){known[e.cat]=1;out.push({id:e.cat,name:'Other',limit:0})}});return out}
const catOf=id=>catList(trip,expenses).find(c=>c.id===id)||{id,name:'Other',limit:0};
function shade(list,id){const i=list.findIndex(c=>c.id===id);return'var(--s'+((i<0?6:i)%7)+')'}
function calc(t,ex){
  const b=t.budget||0,total=sum(ex.map(e=>e.amount)),byCat={};
  ex.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amount});
  const today=todayISO(),spentToday=sum(ex.filter(e=>!e.pre&&e.date===today).map(e=>e.amount));
  let info=null,allowance=null,leftToday=null;
  if(t.start&&t.end&&t.end>=t.start){const N=daysBetween(t.start,t.end)+1;
    if(today<t.start){info={phase:'before',N,until:daysBetween(today,t.start)};allowance=(b-total)/N}
    else if(today>t.end)info={phase:'after',N};
    else{const k=daysBetween(t.start,today)+1,left=N-k+1;allowance=(b-(total-spentToday))/left;leftToday=allowance-spentToday;info={phase:'during',N,k}}}
  return{total,budget:b,byCat,spentToday,info,allowance,leftToday,remaining:b-total,pct:b>0?total/b:0};
}
function ringSvg(c,list){
  const R=100,C=2*Math.PI*R,sw=14,scale=Math.max(c.budget,c.total)||1;let segs='',off=0;
  list.forEach(cat=>{const v=c.byCat[cat.id]||0;if(v<=0)return;const len=v/scale*C,gap=len>6?3:0;
    segs+=`<circle cx="120" cy="120" r="${R}" fill="none" stroke="${shade(list,cat.id)}" stroke-width="${sw}" stroke-dasharray="${Math.max(len-gap,.01).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 120 120)"/>`;off+=len});
  const over=c.budget>0&&c.total>c.budget?'<circle cx="120" cy="120" r="116" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 4"/>':'';
  return`<svg viewBox="0 0 240 240" role="img" aria-label="Budget ring: ${Math.round(c.pct*100)} percent spent"><circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><g class="ring-g">${segs}</g>${over}</svg>`;
}
function miniRing(pct){const R=16,C=2*Math.PI*R,len=Math.min(Math.max(pct||0,0),1)*C;
  return`<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="${R}" fill="none" stroke="var(--track)" stroke-width="5"/>${len>0?`<circle cx="22" cy="22" r="${R}" fill="none" stroke="var(--fg)" stroke-width="5" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 22 22)"/>`:''}</svg>`}

function ensureSubs(){
  let want='';
  if(cur.name==='trip')want='trip:'+cur.id;
  else if(cur.name==='home'&&user)want='mine:'+user.uid;
  if(want===subKey)return;
  unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];subKey=want;tab='list';destroyMap();
  trip=null;expenses=null;tripMissing=false;myTrips=null;animate=true;
  if(!want)return;

        if(!s.exists()){if(s.metadata&&s.metadata.fromCache)return;trip=null;tripMissing=true}else{trip=s.data();tripMissing=false}
        render()},()=>{tripMissing=true;render()}));
      unsub.push(fb.onSnapshot(fb.collection(fb.db,'trips',id,'expenses'),s=>{
        expenses=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));render()},()=>{expenses=[];render()}));

}

/* The intro ring fills one expense at a time while the numbers count down, then loops. */
function startLandingAnim(){
  cancelAnimationFrame(landRAF);
  const ring=document.getElementById('hero-ring');if(!ring)return;
  const segs=[...ring.querySelectorAll('.hseg')],tip=document.getElementById('hero-tip'),num=document.getElementById('hero-num'),pill=document.getElementById('hero-pill'),tick=document.getElementById('ticker');
  const R=100,C=2*Math.PI*R,B=DEMO.budget,GAP=3;
  const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const START=700,STEP=1150,GROW=850,HOLD=2800,OUT=700;
  const TOTAL=START+STEP*DEMO.segs.length+HOLD+OUT;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastTick=-2;
  function draw(t){
    let spent=0,off=0,active=-1,fade=1;
    if(t>TOTAL-OUT)fade=1-(t-(TOTAL-OUT))/OUT;
    DEMO.segs.forEach((x,i)=>{
      const st=START+i*STEP,p=reduce?1:Math.min(Math.max((t-st)/GROW,0),1),e=ease(p);
      const full=x.amt/B*C,len=full*e;
      segs[i].setAttribute('stroke-dasharray',Math.max(len-(len>GAP?GAP:0),0).toFixed(2)+' '+C.toFixed(2));
      segs[i].setAttribute('stroke-dashoffset',(-off).toFixed(2));
      segs[i].style.opacity=fade;
      if(p>0){active=i}
      spent+=x.amt*e;off+=len;
    });
    const ang=(-90+360*(spent/B))*Math.PI/180;
    tip.setAttribute('cx',(120+R*Math.cos(ang)).toFixed(2));tip.setAttribute('cy',(120+R*Math.sin(ang)).toFixed(2));
    tip.setAttribute('r',spent>0&&fade>0?7*fade:0);if(active>=0)tip.setAttribute('fill','var(--s'+active+')');
    num.textContent=fmt(B-spent);pill.textContent=Math.round(spent/B*100)+'% spent';
    const ti=reduce?-1:active;
    if(ti!==lastTick){lastTick=ti;const x=DEMO.segs[ti];
      tick.style.opacity=0;setTimeout(()=>{if(!x){tick.innerHTML='';return}tick.innerHTML=`<i style="background:var(--s${ti})"></i>${esc(x.note)}<b>−${fmt(x.amt)}</b>`;tick.style.opacity=1},200)}
    if(t>TOTAL-OUT&&tick.style.opacity!=='0')tick.style.opacity=0;
  }
  if(reduce){draw(TOTAL-OUT-1);return}
  const t0=performance.now();
  const loop=now=>{if(!document.getElementById('hero-ring'))return;draw((now-t0)%TOTAL);landRAF=requestAnimationFrame(loop)};
  landRAF=requestAnimationFrame(loop);
}

/* ---------- trip page ---------- */
/* Shrink the ring's centre number for long amounts (lakhs, crores) so it always fits inside the ring. */
const fitBig=t=>{const n=Math.max(String(t).length,6);return`font-size:min(17.6cqw,${(68/(n*0.6)).toFixed(2)}cqw)`};
function tripHead(c,list,own){
  const t=trip;let sub='';
  if(c.info){const range=fmtD(t.start)+' to '+fmtD(t.end);
    sub=c.info.phase==='before'?range+', starts in '+plural(c.info.until,'day'):c.info.phase==='during'?range+', day '+c.info.k+' of '+c.info.N:range+', trip finished'}

      :`<div class="big" style="${fitBig(money(-c.remaining))}">${esc(money(-c.remaining))}</div><div class="rc-l">over the ${esc(money(c.budget))} budget</div><div class="rc-p inv">Over budget</div>`)
    :`<div class="big" style="${fitBig(money(c.total))}">${esc(money(c.total))}</div><div class="rc-l">spent so far</div>`;

  else if(c.info&&c.info.phase==='before')s2=['Daily budget',money(c.allowance)];
  else if(c.info&&c.info.phase==='after')s2=['Average a day',money(c.total/c.info.N)];

  return`<header class="wrap"><div class="meta-row">${own?'<a class="back" href="#/">‹ Your trips</a>':''}<time class="clock" id="clock" aria-label="Current date and time">${esc(clockText())}</time></div><div class="top"><div><h1>${esc(t.name)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}${own?'':'<span class="pill">View only</span>'}</div>
  ${own?`<div class="icons"><button class="icon-btn" data-act="share" aria-label="Share trip link">${ICON_SHARE}</button><button class="icon-btn" data-act="settings" aria-label="Trip settings">${ICON_SET}</button></div>`:''}</div>
  <div class="ring-wrap${anim}">${ringSvg(c,list)}<div class="ring-center">${center}</div></div>${legend?`<div class="legend">${legend}</div>`:''}
  <div class="stats"><div class="stat"><div class="v">${esc(money(c.total))}</div><div class="l">Spent</div></div><div class="stat"><div class="v">${esc(s2[1])}</div><div class="l">${s2[0]}</div></div><div class="stat"><div class="v">${esc(s3[1])}</div><div class="l">${s3[0]}</div></div></div></header>`;
}
function alerts(c){
  let out='';

  else if(c.budget>0&&c.pct>=.8)out+=`<div class="alert">${Math.round(c.pct*100)}% of the budget is used. ${esc(money(c.remaining))} left.</div>`;
  (trip.categories||[]).forEach(k=>{if(!k.limit)return;const v=c.byCat[k.id]||0,p=v/k.limit;
    if(p>=1)out+=`<div class="alert inv">${esc(k.name)} is over its limit: ${esc(money(v))} of ${esc(money(k.limit))}.</div>`;
    else if(p>=.8)out+=`<div class="alert">${esc(k.name)} is at ${Math.round(p*100)}% of its ${esc(money(k.limit))} limit.</div>`});

}
function renderTrip(){
  if(tripMissing){document.title=APP_NAME;root.innerHTML=`<main class="wrap center"><h1>This trip doesn't exist</h1><p>It may have been deleted, or the link is incomplete.</p><a class="btn" href="#/">Go to ${esc(APP_NAME)}</a></main>`;return}
  if(!trip||!expenses){root.innerHTML=loadingHtml('Loading the trip…');return}
  document.title=trip.name||'Trip';
  const own=isOwner(),list=catList(trip,expenses),c=calc(trip,expenses);
  const opts='<option value="all">All categories</option>'+list.map(k=>`<option value="${esc(k.id)}"${catFilter===k.id?' selected':''}>${esc(k.name)}</option>`).join('');

  const unv=user&&trip.owner===user.uid&&!user.emailVerified?`<div class="alert">Confirm your email to add or change expenses. <a class="link" href="#/">Confirm now</a></div>`:'';
  root.innerHTML=`<div class="trip-layout">`+tripHead(c,list,own)+`<main class="wrap">${unv}${alerts(c)}${bar}${panel}
  ${own?'':`<a class="foot" href="#/">Track your own trip with <u>${esc(APP_NAME)}</u></a>`}</main></div>${own&&tab!=='map'?'<button class="btn fab" data-act="add">Add expense</button>':''}`;

function renderList(){

function rowHtml(e,own){

/* ---------- split & settle up ---------- */
const splitOn=()=>!!(trip&&trip.mode==='split'&&(trip.members||[]).length>1);
function modePicker(sel){return`<div class="chips"><label class="chip"><input type="radio" name="mode" value="pool"${sel!=='split'?' checked':''}><span>One shared pool</span></label><label class="chip"><input type="radio" name="mode" value="split"${sel==='split'?' checked':''}><span>Split as we go</span></label></div><div class="hint">Split as we go: log who paid, and ${esc(APP_NAME)} works out who owes whom.</div>`}
function splitFields(d){const m=trip.members.slice();if(d.paidBy&&!m.includes(d.paidBy))m.push(d.paidBy);
  const sp=d.split&&d.split.length?d.split:trip.members;const payer=d.paidBy||trip.members[0];
  return`<label class="f" for="paidBy">Paid by</label><select id="paidBy" name="paidBy">${m.map(n=>`<option${n===payer?' selected':''}>${esc(n)}</option>`).join('')}</select>
  <span class="f">Split between</span><div class="chips">${trip.members.map(n=>`<label class="chip"><input type="checkbox" name="split" value="${esc(n)}"${sp.includes(n)?' checked':''}><span>${esc(n)}</span></label>`).join('')}</div>`}
function balances(){const names=trip.members.slice(),m={};let missing=0;
  const add=n=>{if(n&&!names.includes(n))names.push(n)};
  expenses.forEach(e=>{add(e.paidBy);(e.split||[]).forEach(add)});(trip.settlements||[]).forEach(x=>{add(x.from);add(x.to)});
  names.forEach(n=>{m[n]={paid:0,share:0,sent:0,recv:0}});
  expenses.forEach(e=>{if(!e.paidBy||!(e.split&&e.split.length)){missing++;return}m[e.paidBy].paid+=e.amount;e.split.forEach(n=>{m[n].share+=e.amount/e.split.length})});
  (trip.settlements||[]).forEach(x=>{m[x.from].sent+=x.amount;m[x.to].recv+=x.amount});
  names.forEach(n=>{const r=m[n];r.net=r.paid-r.share+r.sent-r.recv});
  return{m,names,missing}}
function settleUp(m){const cr=[],db=[];
  Object.keys(m).forEach(n=>{const net=Math.round(m[n].net*100)/100;if(net>.5)cr.push({n,v:net});else if(net<-.5)db.push({n,v:-net})});
  cr.sort((a,b)=>b.v-a.v);db.sort((a,b)=>b.v-a.v);const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const x=Math.round(Math.min(db[i].v,cr[j].v)*100)/100;out.push({from:db[i].n,to:cr[j].n,v:x});db[i].v-=x;cr[j].v-=x;if(db[i].v<.5)i++;if(cr[j].v<.5)j++}
  return out}
function splitPanel(){
  const b=balances(),own=isOwner(),done=trip.settlements||[];
  const rows=b.names.map(n=>{const r=b.m[n],net=r.net;
    const st=Math.abs(net)<.5?'<span class="neg">Settled</span>':net>0?`<span class="pos">Gets back ${esc(money(net))}</span>`:`<span class="neg">Owes ${esc(money(-net))}</span>`;
    const extra=(r.sent?`, sent ${money(r.sent)}`:'')+(r.recv?`, received ${money(r.recv)}`:'');
    return`<div class="kv"><span>${esc(n)}<small>Paid ${esc(money(r.paid))}, share ${esc(money(r.share))}${esc(extra)}</small></span>${st}</div>`}).join('');
  const s=settleUp(b.m);
  const sl=s.length?s.map(x=>`<div class="settle"><span>${esc(x.from)} pays ${esc(x.to)}</span><b>${esc(money(x.v))}</b>${own?`<button class="btn ghost sm" data-act="settle" data-from="${esc(x.from)}" data-to="${esc(x.to)}" data-amt="${x.v}">Settled</button>`:''}</div>`).join(''):'<div class="lead" style="margin:0">Everyone is even.</div>';
  const hist=done.length?`<div class="card"><h3>Settled payments</h3>${done.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<div class="settle"><span>${esc(x.from)} paid ${esc(x.to)}<small style="display:block;color:var(--muted);font-size:12px">${esc(new Date(x.t).toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}</small></span><b>${esc(money(x.amount))}</b>${own?`<button class="link quiet" data-act="unsettle" data-i="${i}">Undo</button>`:''}</div>`).join('')}</div>`:'';
  return`<div class="card"><h3>To settle up</h3>${sl}</div>${hist}<div class="card"><h3>Balances</h3>${rows}</div>
  ${b.missing?`<p class="hint">${plural(b.missing,'expense')} without a payer ${b.missing===1?'isn\'t':'aren\'t'} counted here. Open ${b.missing===1?'it':'them'} to set who paid.</p>`:''}`;
}
function markSettled(from,to,amt){
  if(!(amt>0)||!confirm(`Mark that ${from} paid ${to} ${money(amt)}?`))return;track('settle_mark');
  const list=(trip.settlements||[]).slice(-499).concat([{from,to,amount:amt,t:Date.now()}]);

function undoSettled(i){
  const list=(trip.settlements||[]).slice(),x=list[i];if(!x||!confirm(`Undo "${x.from} paid ${x.to} ${money(x.amount)}"?`))return;
  list.splice(i,1);

/* ---------- summary ---------- */
function summaryData(c,list){
  const t=trip,ex=expenses,n=(t.members||[]).length;
  const pre=sum(ex.filter(e=>e.pre).map(e=>e.amount)),during=c.total-pre;
  let days=null;if(c.info)days=c.info.phase==='during'?c.info.k:c.info.phase==='after'?c.info.N:null;
  else{const ds={};ex.forEach(e=>{if(!e.pre)ds[e.date]=1});days=Object.keys(ds).length||null}
  const cats=list.map(k=>({k,v:c.byCat[k.id]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const big=ex.slice().sort((a,b)=>b.amount-a.amount)[0]||null;
  const byDay={};ex.filter(e=>!e.pre).forEach(e=>{byDay[e.date]=(byDay[e.date]||0)+e.amount});
  const busy=Object.keys(byDay).sort((a,b)=>byDay[b]-byDay[a])[0]||null;
  return{n,pre,during,days,cats,big,busy,busyAmt:busy?byDay[busy]:0,places:ex.filter(e=>e.loc).length}
}
function summaryPanel(c,list){

  <div class="grid2">${mini(esc(d.n>1?money(c.total/d.n):String(expenses.length)),d.n>1?'Per person':'Expenses')}${mini(d.days?esc(money(d.during/d.days)):'–','Average a day')}
  ${mini(d.big?esc(money(d.big.amount)):'–',d.big?'Biggest: '+esc(d.big.note||catOf(d.big.cat).name):'Biggest spend')}${mini(d.busy?esc(fmtD(d.busy)):'–',d.busy?'Busiest day, '+esc(money(d.busyAmt)):'Busiest day')}

/* ---------- map ---------- */
const ML=['https://unpkg.com/maplibre-gl@4.7.1/dist/','https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/'];
const MAP_STYLE='https://tiles.openfreemap.org/styles/positron';
let mapS=null,mapLibP=null,baseStyleP=null;
const located=()=>(expenses||[]).filter(e=>e.loc&&typeof e.loc.lat==='number').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
function loadAsset(tag,urls){return new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length)return rej(new Error('load'));const el=document.createElement(tag);
  if(tag==='link'){el.rel='stylesheet';el.href=urls[i++]}else el.src=urls[i++];el.onload=res;el.onerror=()=>{el.remove();next()};document.head.appendChild(el)};next()})}

function loadBaseStyle(){if(!baseStyleP)baseStyleP=fetch(MAP_STYLE).then(r=>{if(!r.ok)throw new Error('style');return r.json()}).catch(e=>{baseStyleP=null;throw e});return baseStyleP}
function mapColors(){const p=PALETTES.find(x=>x.id===validTheme(trip&&trip.theme))||PALETTES[0];
  if(p.id==='mono'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)return p.mapDark;return p.map}
/* Recolour an OpenMapTiles-style map so it matches the trip's theme, and add 3D buildings. */
function themeStyle(base,m){
  const st=JSON.parse(JSON.stringify(base)),has=(id,re)=>re.test(id);
  st.layers=st.layers.filter(l=>!/housenum/i.test(l.id));
  st.layers.forEach(l=>{const id=(l.id+' '+(l['source-layer']||'')).toLowerCase();l.paint=l.paint||{};
    if(l.type==='background')l.paint['background-color']=m.land;
    else if(l.type==='fill'){const c=has(id,/water|ocean|lake|river/)?m.water:has(id,/park|wood|forest|grass|green|garden|pitch|golf|cemetery|landcover/)?m.park:has(id,/building/)?m.building:m.area;
      l.paint['fill-color']=c;if('fill-outline-color'in l.paint)l.paint['fill-outline-color']=c;delete l.paint['fill-pattern']}
    else if(l.type==='line'){if(has(id,/water|river|stream|canal/))l.paint['line-color']=m.water;
      else if(has(id,/boundary|admin/)){l.paint['line-color']=m.label;l.paint['line-opacity']=.35}
      else if(has(id,/rail|transit/)){l.paint['line-color']=m.label;l.paint['line-opacity']=.3}
      else l.paint['line-color']=has(id,/motorway|trunk|primary|major/)?m.major:m.road}

/* Group bubbles that would overlap on screen (same place, or very close at this zoom) into one bubble. */
function clusterPts(map,pts){const R=48,cl=[];
  pts.forEach(e=>{const p=map.project([e.loc.lng,e.loc.lat]);let c=cl.find(c=>Math.hypot(c.x-p.x,c.y-p.y)<R);
    if(c){c.items.push(e);c.total+=e.amount}else cl.push({x:p.x,y:p.y,items:[e],total:e.amount})});
  cl.forEach(c=>{c.lng=c.items.reduce((s,e)=>s+e.loc.lng,0)/c.items.length;c.lat=c.items.reduce((s,e)=>s+e.loc.lat,0)/c.items.length;c.key=c.items.map(e=>e.id).sort().join(',')});
  return cl}
function spreadM(items){const a=items[0].loc;let m=0;
  items.forEach(e=>{const dy=(e.loc.lat-a.lat)*111320,dx=(e.loc.lng-a.lng)*111320*Math.cos(a.lat*Math.PI/180);m=Math.max(m,Math.hypot(dx,dy))});return m}
function bubbleEl(e,list,extraCls){const idx=Math.max(list.findIndex(k=>k.id===e.cat),0)%7,col=hexFromVar('--s'+idx);

  el.style.setProperty('--c',col);el.style.setProperty('--ct',textOn(col));
  el.setAttribute('aria-label',(e.note||catOf(e.cat).name)+', '+money(e.amount));el.innerHTML=`<span>${esc(money(e.amount))}</span>`;
  el.addEventListener('click',ev=>{ev.stopPropagation();selectExpense(e.id)});return el}
/* Expenses that overlap on screen are drawn as a fanned stack of cards, like a hand of playing cards. */
function renderMarkers(pop){
  const my=mapS;if(!my||!my.map||!my.ready)return;const map=my.map,pts=located(),list=catList(trip,expenses);
  const cls=clusterPts(map,pts),sig=cls.map(c=>c.key+':'+c.total).join('|')+'#'+pts.map(e=>e.amount+e.cat).join();

    const items=c.items.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.t||0)-(y.t||0));
    const shown=items.slice(-MAX),extra=items.length-shown.length;
    const el=document.createElement('div');el.className='stack';
    shown.forEach((e,i)=>{const b=bubbleEl(e,list,i?' up':'');
      const rot=i===0?0:(i%2?-4:3.5);b.style.setProperty('--tf',`translate(${i*5}px,${-i*STEP}px) rotate(${rot}deg)`);b.style.zIndex=i+1;
      if(pop)b.style.animationDelay=(250+(n++)*70)+'ms';else b.style.animation='none';el.appendChild(b)});
    if(extra>0){const m=document.createElement('button');m.type='button';m.className='bubble up more';const k=shown.length;
      m.style.setProperty('--tf',`translate(${k*5}px,${-k*STEP}px)`);m.style.zIndex=k+1;m.innerHTML=`<span>+${extra} more</span>`;

function commit(f,p,msg){

  const timer=setTimeout(()=>{if(done)return;done=true;end();closeSheet();toast(msg+'. It will sync when you\'re online.')},navigator.onLine?6000:300);

  const dom=email.split('@')[1].toLowerCase(),fix=DOMAIN_FIX[dom];

      :c==='auth/account-exists-with-different-credential'?'This email already has a password login. Log in with your email and password.'
      :c==='auth/operation-not-allowed'?'Google sign-in isn\'t turned on for this app yet.'
      :c==='auth/unauthorized-domain'?'This website isn\'t on Firebase\'s list of authorized domains yet.'
      :authMsg(e));
  });
}
function submitLogin(f){
  const fd=new FormData(f),email=String(fd.get('email')||'').trim(),pw=String(fd.get('password')||'');
  if(!email||!pw)return formErr('Enter your email and password.');
  saving=true;busy(f,true,'Logging in…');
  fb.signInWithEmailAndPassword(fb.auth,email,pw).then(()=>{saving=false;track('login',{method:'email'});location.hash='#/'},e=>{saving=false;busy(f,false);formErr(authMsg(e))});
}
function forgot(){
  const el=root.querySelector('[name=email]'),email=el?el.value.trim():'';
  if(!email){formErr('Type your email above, then tap Forgot password.');if(el)el.focus();return}
  const ok='If there\'s an account for '+email+', a reset link is on its way. Check your spam folder too.';
  fb.sendPasswordResetEmail(fb.auth,email).then(()=>formErr(ok),e=>{if(e&&e.code==='auth/user-not-found')formErr(ok);else formErr(authMsg(e))});
}
function submitObTrip(f){
  const fd=new FormData(f),name=String(fd.get('name')||'').trim(),budget=parseFloat(fd.get('budget'));
  if(!name)return formErr('Give your trip a name.');
  if(!(budget>0))return formErr('Enter a total budget above zero.');
  Object.assign(ob.d,{name,budget:String(budget),currency:fd.get('currency')||'INR',theme:validTheme(fd.get('theme'))});saveDeviceTheme(ob.d.theme);ob.step=3;render();
}
function readDetails(f){const fd=new FormData(f);Object.assign(ob.d,{start:fd.get('start')||'',end:fd.get('end')||'',members:String(fd.get('members')||''),mode:fd.get('mode')==='split'?'split':'pool'})}
/* Refresh the login token so Firebase sees an email confirmed since the last sign-in. */
async function freshToken(){try{const u=fb.auth.currentUser;if(u){await u.reload();await u.getIdToken(true);user=fb.auth.currentUser}}catch(e){}}
async function submitObDetails(f){
  readDetails(f);const d=ob.d;
  if(d.start&&d.end&&d.end<d.start)return formErr('The end date is before the start date.');
  if(!navigator.onLine)return formErr('You\'re offline. Connect to the internet to create the trip.');
  saving=true;busy(f,true,'Creating trip…');
  const data=()=>({owner:user.uid,name:d.name.slice(0,60),budget:parseFloat(d.budget)||0,currency:d.currency,start:d.start,end:d.end,
    members:parseNames(d.members),theme:validTheme(d.theme),mode:d.mode==='split'?'split':'pool',fx:{code:'',rate:0},categories:DEFAULT_CATS.map(c=>Object.assign({},c)),spent:0,
    createdAt:fb.serverTimestamp(),updatedAt:fb.serverTimestamp()});
  let ref=fb.doc(fb.collection(fb.db,'trips'));
  try{
    try{await fb.setDoc(ref,data())}
    catch(e){
      if(!e||e.code!=='permission-denied')throw e;
      await freshToken();
      if(needsVerify()){saving=false;toast('Confirm your email first');render();return}
      ref=fb.doc(fb.collection(fb.db,'trips'));await fb.setDoc(ref,data());
    }
    saving=false;track('trip_create',{currency:d.currency,mode:d.mode==='split'?'split':'pool',theme:validTheme(d.theme),has_dates:d.start&&d.end?1:0,people:parseNames(d.members).length});ob.created=ref.id;render();
  }catch(e){saving=false;busy(f,false);formErr(e&&e.code==='permission-denied'?'Couldn\'t create the trip. Log out, log back in, and try again.':errMsg(e))}
}
function submitExpense(f){
  if(locBusy)return formErr('Still finding your location. One moment.');
  const t=trip,fd=new FormData(f),amt=parseFloat(fd.get('amt'));
  if(!(amt>0))return formErr('Enter an amount above zero.');
  const cat=fd.get('cat');if(!cat)return formErr('Pick a category.');
  const code=fd.get('code')||t.currency,id=f.dataset.id,old=id?expenses.find(x=>x.id===id):null;
  let amount=amt,orig=null;
  if(code!==t.currency){const rate=t.fx&&t.fx.code===code&&t.fx.rate>0?t.fx.rate:(old&&old.orig&&old.orig.code===code?old.amount/old.orig.amt:0);
    if(!(rate>0))return formErr('Set an exchange rate for '+code+' in trip settings.');amount=Math.round(amt*rate*100)/100;orig={amt,code}}
  let paidBy='',split=[];
  if(splitOn()){paidBy=String(fd.get('paidBy')||'');split=fd.getAll('split').map(String);
    if(!paidBy)return formErr('Pick who paid.');if(!split.length)return formErr('Pick at least one person to split with.')}
  const e={date:fd.get('date')||todayISO(),amount,orig,paidBy,split,loc:formLoc?{lat:formLoc.lat,lng:formLoc.lng,acc:formLoc.acc||0}:null,cat:String(cat),note:String(fd.get('note')||'').trim().slice(0,80),pay:String(fd.get('pay')||'UPI'),pre:!!fd.get('pre'),t:old&&old.t?old.t:Date.now()};
  const b=fb.writeBatch(fb.db);
  const ref=id?fb.doc(fb.db,'trips',cur.id,'expenses',id):fb.doc(fb.collection(fb.db,'trips',cur.id,'expenses'));
  b.set(ref,e);
  b.update(fb.doc(fb.db,'trips',cur.id),{spent:fb.increment(amount-(old?old.amount:0)),updatedAt:fb.serverTimestamp()});
  if(!id)track('expense_add',{has_location:e.loc?1:0,mode:trip.mode==='split'?'split':'pool',foreign_currency:orig?1:0});
  commit(f,b.commit(),id?'Expense updated':'Expense added');
}
function deleteExpense(id){
  const old=expenses.find(x=>x.id===id);if(!old||!confirm('Delete this expense?'))return;
  const b=fb.writeBatch(fb.db);
  b.delete(fb.doc(fb.db,'trips',cur.id,'expenses',id));
  b.update(fb.doc(fb.db,'trips',cur.id),{spent:fb.increment(-old.amount),updatedAt:fb.serverTimestamp()});
  commit(host.querySelector('form'),b.commit(),'Expense deleted');
}
function submitSettings(f){
  const fd=new FormData(f),name=String(fd.get('name')||'').trim(),budget=parseFloat(fd.get('budget'));
  if(!name)return formErr('Give your trip a name.');
  if(!(budget>0))return formErr('Enter a total budget above zero.');
  const start=fd.get('start')||'',end=fd.get('end')||'';
  if(start&&end&&end<start)return formErr('The end date is before the start date.');
  const currency=fd.get('currency')||'INR',fxcode=fd.get('fxcode')||'',fxrate=parseFloat(fd.get('fxrate'))||0;
  if(fxcode&&fxcode!==currency&&!(fxrate>0))return formErr('Enter an exchange rate for '+fxcode+'.');
  const categories=(trip.categories||[]).map(k=>{const v=parseFloat(fd.get('lim-'+k.id));return{id:k.id,name:k.name,limit:v>0?v:0}});
  const nc=String(fd.get('newcat')||'').trim().slice(0,24);
  if(nc&&categories.length<40)categories.push({id:'c'+Date.now().toString(36),name:nc,limit:0});
  const theme=validTheme(fd.get('theme'));saveDeviceTheme(theme);
  commit(f,fb.updateDoc(fb.doc(fb.db,'trips',cur.id),{name:name.slice(0,60),budget,currency,start,end,members:parseNames(fd.get('members')),theme,mode:fd.get('mode')==='split'?'split':'pool',
    fx:{code:fxcode===currency?'':fxcode,rate:fxcode===currency?0:fxrate},categories,updatedAt:fb.serverTimestamp()}),'Trip settings saved');
}
async function deleteTrip(){
  if(!trip||!confirm('Delete "'+trip.name+'" and all its expenses? This can\'t be undone.'))return;
  const id=cur.id,f=host.querySelector('form');saving=true;
  const btn=host.querySelector('[data-act=delete-trip]');if(btn){btn.disabled=true;btn.textContent='Deleting…'}
  try{
    const s=await fb.getDocs(fb.collection(fb.db,'trips',id,'expenses'));
    let b=fb.writeBatch(fb.db),n=0;
    for(const d of s.docs){b.delete(d.ref);n++;if(n%400===0){await b.commit();b=fb.writeBatch(fb.db)}}
    if(n%400)await b.commit();
    await fb.deleteDoc(fb.doc(fb.db,'trips',id));
    saving=false;closeSheet();location.hash='#/';toast('Trip deleted');
  }catch(e){saving=false;if(btn){btn.disabled=false;btn.textContent='Delete this trip'}formErr(errMsg(e))}
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='scrim'){if(ev.target===b&&!saving)closeSheet();return}
  if(a==='close'){if(!saving)closeSheet();return}
  if(a==='pwtoggle'){const i=b.parentNode.querySelector('input'),show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-label',show?'Hide password':'Show password');return}
  if(a==='forgot'){forgot();return}
  if(a==='tag-x'){const t=b.closest('.tag'),w=t.closest('.tags');t.remove();tagSync(w);w.querySelector('.tag-in').focus();return}
  if(a==='google'){googleSignIn(b);return}
  if(a==='resend'){if(Date.now()<verifyCooldown){formErr('Email sent. You can send another in '+Math.ceil((verifyCooldown-Date.now())/1000)+' seconds.');return}sendVerify(false);return}
  if(a==='loc-get'){if(!locBusy)getLocation();return}
  if(a==='loc-clear'){formLoc=null;renderLoc();return}
  if(a==='logout'){fb.signOut(fb.auth).then(()=>{location.hash='#/'});return}
  if(a==='ob-back'){const f=root.querySelector('form');if(f){f.querySelectorAll('.tag-in').forEach(tagCommit);readDetails(f)}ob.step=2;render();return}
  if(a==='ob-share'){shareLink(ob.created,ob.d.name);return}
  if(a==='tab'){tab=b.dataset.tab;if(tab!=='list')track(tab==='map'?'map_open':tab==='split'?'split_view':'summary_view');render();if(tab==='map'){const t=document.querySelector('.tabs');if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(a==='map-fit'){fitMap(true);return}
  if(a==='map-tilt'){toggleTilt(b);return}
  if(a==='map-close'){selectBubble(null);return}
  if(a==='share-summary'){shareSummary();return}
  if(a==='csv'){downloadCsv();return}
  if(!isOwner()||saving)return;
  if(a==='add')expenseForm(null);
  else if(a==='edit')expenseForm(b.dataset.id);
  else if(a==='settings')settingsForm();
  else if(a==='share')shareLink(cur.id,trip.name);
  else if(a==='delete-exp')deleteExpense(b.dataset.id);
  else if(a==='delete-trip')deleteTrip();
  else if(a==='settle')markSettled(b.dataset.from,b.dataset.to,parseFloat(b.dataset.amt));
  else if(a==='unsettle')undoSettled(parseInt(b.dataset.i,10));
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target;if(saving)return;formErr('');f.querySelectorAll('.tag-in').forEach(tagCommit);
  if(f.dataset.form==='verify'){checkVerified(f);return}
  const h={expense:submitExpense,settings:submitSettings,signup:submitSignup,login:submitLogin,'ob-trip':submitObTrip,'ob-details':submitObDetails}[f.dataset.form];
  if(h)h(f);
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){q=ev.target.value;renderList()}});
document.addEventListener('change',ev=>{if(ev.target.id==='cf'){catFilter=ev.target.value;renderList()}
  else if(ev.target.name==='theme'){applyTheme(ev.target.value);if(ob&&cur.name==='start')ob.d.theme=validTheme(ev.target.value)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&host.innerHTML&&!saving)closeSheet()});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
window.addEventListener('hashchange',go);

/* ---------- start ---------- */
(async function boot(){
  if(/^PASTE/.test(firebaseConfig.apiKey)||!firebaseConfig.projectId){
    root.innerHTML=`<main class="wrap center"><h1>Almost ready</h1><p>Firebase isn't connected yet. Paste your Firebase config at the top of index.html.</p></main>`;return}
  try{
    const [appM,authM,fsM]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
    const app=appM.initializeApp(firebaseConfig);
    let db;
    try{db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})})}
    catch(e){db=fsM.getFirestore(app)}
    fb=Object.assign({},authM,fsM,{auth:authM.getAuth(app),db});
  }catch(e){
    root.innerHTML=`<main class="wrap center"><h1>Couldn't load</h1><p>Check your internet connection, then refresh the page.</p></main>`;return}
  fb.onAuthStateChanged(fb.auth,u=>{user=u;authReady=true;render()});
  go();
  gaLoad();
})();
</script>
